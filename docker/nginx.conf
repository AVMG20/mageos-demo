# nginx runs unprivileged as www-data on 8080 and hands PHP to php-fpm on 127.0.0.1:9000.
# The Magento rules come from the project's own nginx.conf.sample.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # bitploy terminates TLS; Magento reads X-Forwarded-Proto (passed through as HTTP_X_FORWARDED_PROTO).
    upstream fastcgi_backend {
        server 127.0.0.1:9000;
    }

    server {
        listen 8080 default_server;
        server_name _;

        set $MAGE_ROOT /var/www/html;
        include /var/www/html/nginx.conf.sample;
    }
}
