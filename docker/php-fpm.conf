; Pool overrides on top of the image's www.conf / zz-docker.conf (listen = 9000).
[www]
; only nginx in this container talks to FPM
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 600
; nginx already logs every request
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
